<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FunLessons – Flashcards 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
/* --- ESTILOS VISUALES --- */
:root {
    --primary: #ff7043;
    --secondary: #ffca28;
    --accent: #26a69a;
    --bg-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
}

body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh;
    padding: 15px;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 600px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(255, 112, 67, 0.3);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

header {
    background: var(--primary);
    color: #fff;
    padding: 15px;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
.logo { font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; margin: 0; }

.controls-top {
    padding: 15px;
    background: #fff;
    border-bottom: 2px solid #eee;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
}

/* Panel de selección múltiple */
#multiSelectContainer {
    display: none;
    background: #f0f2f1;
    padding: 15px;
    border-radius: 15px;
    margin: 10px;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    border: 2px solid var(--accent);
}

.check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    color: #444;
}

select {
    padding: 10px 20px;
    border-radius: 25px;
    border: 2px solid var(--accent);
    font-size: 1rem;
    font-weight: bold;
    color: var(--accent);
    outline: none;
    cursor: pointer;
    background: #e0f2f1;
}

/* --- ESCENARIO DE LA FLASHCARD --- */
.scene {
    width: 100%;
    height: 350px;
    perspective: 1000px;
    margin: 20px 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 280px;
    height: 320px;
    position: relative;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    cursor: pointer;
}

.card.is-flipped { transform: rotateY(180deg); }

.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    border: 4px solid #fff;
    padding: 10px;
    box-sizing: border-box;
}

.card-face.front { background: #fff; border-color: var(--secondary); }
.card-face.back { background: var(--accent); color: white;
transform: rotateY(180deg); border-color: var(--accent); }

.emoji-img { 
    width: 100%;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8rem; 
    line-height: 1;
}

.emoji-img img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));
}

.word-text { font-size: 2.5rem; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; text-align: center; }
.tap-hint { font-size: 0.9rem; color: #aaa; margin-top: 10px; opacity: 0.7; }
.tap-hint.white { color: rgba(255,255,255,0.8); }

.nav-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    background: #f9f9f9;
}

.nav-btn {
    background: white;
    border: 2px solid var(--primary);
    color: var(--primary);
    width: 50px; height: 50px;
    border-radius: 50%;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}

.nav-btn:disabled { border-color: #ccc; color: #ccc; }
.counter { font-size: 1.1rem; font-weight: bold; color: #777; background: #eee; padding: 5px 15px; border-radius: 15px; }

.sound-btn-small {
    background: rgba(255,255,255,0.2);
    border: 2px solid #fff;
    color: #fff;
    border-radius: 50%;
    width: 45px; height: 45px;
    cursor: pointer;
    font-size: 1.2rem;
}
</style>
</head>
<body>

<div class="app">
    <header><div class="logo">⚡ Flashcards 3 <span>🇬🇧</span></div></header>

    <div class="controls-top">
        <div style="display:flex; align-items:center; gap:10px;">
            <label style="font-weight:bold; color:#666;">Topic:</label>
            <select id="categorySelect" onchange="toggleMultiSelect()">
                <option value="ALL">🌟 All Topics</option>
                <option value="MIX_TOPICS">🌪️ Mix Topics</option>
                <option value="DAYS">🗓️ Days</option>
                <option value="ROUTINES">⏰ Routines</option>
                <option value="TRANSPORT">🚗 Transport</option>
                <option value="SUBJECTS">📚 Subjects</option>
                <option value="TOWN">🏙️ Town</option>
                <option value="ANIMALS">🦁 Animals</option>
                <option value="ANIMALS_BODY">🦴 Animals body</option>
                <option value="ACTIONS">🏃 Actions</option>
                <option value="HOBBIES">🎨 Hobbies</option>
                <option value="FOOD">🍎 Food</option>
            </select>
        </div>

        <div id="multiSelectContainer">
            <label class="check-item"><input type="checkbox" value="DAYS">🗓️ Days</label>
            <label class="check-item"><input type="checkbox" value="ROUTINES">⏰ Routines</label>
            <label class="check-item"><input type="checkbox" value="TRANSPORT">🚗 Transport</label>
            <label class="check-item"><input type="checkbox" value="SUBJECTS">📚 Subjects</label>
            <label class="check-item"><input type="checkbox" value="TOWN">🏙️ Town</label>
            <label class="check-item"><input type="checkbox" value="ANIMALS">🦁 Animals</label>
            <label class="check-item"><input type="checkbox" value="ANIMALS_BODY">🦴 Body</label>
            <label class="check-item"><input type="checkbox" value="ACTIONS">🏃 Actions</label>
            <label class="check-item"><input type="checkbox" value="HOBBIES">🎨 Hobbies</label>
            <label class="check-item"><input type="checkbox" value="FOOD">🍎 Food</label>
            <button onclick="applyAndClose()" style="grid-column: span 2; background: var(--accent); color: white; border: none; padding: 10px; border-radius: 15px; font-weight: bold; cursor: pointer;">Apply Mix</button>
        </div>
    </div>

    <div class="scene">
        <div class="card" id="flashcard" onclick="flipCard()">
            <div class="card-face front">
                <div class="emoji-img" id="cardImg">❓</div>
                <div class="tap-hint">👆 Tap to flip</div>
            </div>
            <div class="card-face back">
                <div class="word-text" id="cardWord">WORD</div>
                <button class="sound-btn-small" onclick="event.stopPropagation(); playCurrentAudio()">🔊</button>
                <div class="tap-hint white">👆 Tap to flip back</div>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" onclick="prevCard()">⬅️</button>
        <div class="counter" id="counterDisplay">1 / 10</div>
        <button class="nav-btn" id="nextBtn" onclick="nextCard()">➡️</button>
    </div>
</div>

<script>

    {en:"HAM", img:"ham.png", cat:"FOOD", isImage: true},

    {en:"SAUSAGES", img:"sausages.png", cat:"FOOD", isImage: true},
    {en:"SPAGHETTI", img:"🍝", cat:"FOOD"},
    {en:"VEGETABLES", img:"vegetables.png", cat:"FOOD", isImage: true},
    {en:"BROCCOLI", img:"🥦", cat:"FOOD"},
    {en:"CAKE", img:"🍰", cat:"FOOD"},
    {en:"CHEESE", img:"🧀", cat:"FOOD"},
    {en:"CHICKEN", img:"chicken.png", cat:"FOOD", isImage: true},
    {en:"FISH", img:"🐟", cat:"FOOD"},
    {en:"FRUIT", img:"🍎", cat:"FOOD"},

    {en:"SALAD", img:"🥗", cat:"FOOD"},

    {en:"APPLE", img:"🍎", cat:"FOOD"},
    {en:"BANANA", img:"🍌", cat:"FOOD"},
    {en:"ORANGE", img:"🍊", cat:"FOOD"},
    {en:"PEAR", img:"🍐", cat:"FOOD"},
    {en:"STRAWBERRY", img:"🍓", cat:"FOOD"},
    {en:"JUICE", img:"🧃", cat:"FOOD"},
    {en:"MILK", img:"🥛", cat:"FOOD"},
    {en:"WATER", img:"💧", cat:"FOOD"},
    {en:"CARROTS", img:"🥕", cat:"FOOD"},
    {en:"CAULIFLOWER", img:"cauliflower.png", cat:"FOOD", isImage: true},
    {en:"PEAS", img:"🫛", cat:"FOOD"}
];

let currentList = [], currentIndex = 0, isFlipped = false;
const ui = {
    card: document.getElementById("flashcard"),
    img: document.getElementById("cardImg"),
    word: document.getElementById("cardWord"),
    counter: document.getElementById("counterDisplay"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    multiPanel: document.getElementById("multiSelectContainer")
};

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function toggleMultiSelect() {
    const cat = document.getElementById("categorySelect").value;
    ui.multiPanel.style.display = (cat === "MIX_TOPICS") ? "grid" : "none";
    if (cat !== "MIX_TOPICS") changeCategory();
}

function applyAndClose() {
    changeCategory();
    ui.multiPanel.style.display = "none";
}

function changeCategory() {
    const cat = document.getElementById("categorySelect").value;
    let tempList = [];

    if (cat === "ALL") {
        tempList = [...vocab];
    } else if (cat === "MIX_TOPICS") {
        const checkedValues = Array.from(ui.multiPanel.querySelectorAll('input:checked')).map(cb => cb.value);
        tempList = vocab.filter(item => checkedValues.includes(item.cat));
    } else {
        tempList = vocab.filter(item => item.cat === cat);
    }

    if (tempList.length === 0) return;
    currentList = shuffleArray(tempList);
    currentIndex = 0;
    resetCardFace();
    updateUI();
}

function updateUI() {
    if(currentList.length === 0) return;
    const item = currentList[currentIndex];
    if (item.isImage) {
        ui.img.innerHTML = `<img src="${item.img}" alt="${item.en}">`;
    } else {
        ui.img.innerHTML = item.img;
    }
    ui.word.textContent = item.en;
    ui.counter.textContent = `${currentIndex + 1} / ${currentList.length}`;
    ui.prevBtn.disabled = (currentIndex === 0);
    ui.nextBtn.disabled = (currentIndex === currentList.length - 1);
}

function flipCard() {
    isFlipped = !isFlipped;
    ui.card.classList.toggle("is-flipped", isFlipped);
    if(isFlipped) setTimeout(playCurrentAudio, 200);
}

function resetCardFace() { isFlipped = false; ui.card.classList.remove("is-flipped"); }
function nextCard() { if(currentIndex < currentList.length - 1) { currentIndex++; resetCardFace(); setTimeout(updateUI, 150); } }
function prevCard() { if(currentIndex > 0) { currentIndex--; resetCardFace(); setTimeout(updateUI, 150); } }

function playCurrentAudio() {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(currentList[currentIndex].en);
    utterance.lang = "en-GB"; utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}

changeCategory();
</script>
</body>
</html>
