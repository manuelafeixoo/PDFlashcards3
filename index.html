<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcards Year 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
/* --- ESTILOS VISUALES "KIDS & HAPPY" --- */
:root {
    --primary: #ff9800; /* CAMBIO 5: Naranja en vez de amarillo */
    --secondary: #00e5ff; /* Cian brillante */
    --accent-purple: #d500f9; /* Magenta vibrante */
    --bg-gradient: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%); /* Fondo naranja claro */
    --color-img-mode: #ff9800; /* CAMBIO 1: Fondo naranja para modo Imagen-Inglés */
    --color-word-mode: #3f51b5; /* CAMBIO 2: Fondo azul (igual que tarjetas) para modo Inglés-Imagen */
    --color-exam-mode: #90ee90; /* CAMBIO 3: Fondo verde claro para modo Exam */
    --color-success: #4caf50; 
    --color-error: #f44336;
    --card-bg-word: #3f51b5;
}

body {
    margin: 0; font-family: "Comic Sans MS", "Segoe UI", Tahoma, sans-serif;
    background: var(--bg-gradient); min-height: 100vh;
    padding: 10px; display: flex; flex-direction: column; align-items: center;
}

.app {
    width: 100%; max-width: 500px;
    background: #ffffff; border-radius: 40px;
    box-shadow: 0 20px 0px rgba(255, 152, 0, 0.3), 0 25px 50px rgba(0,0,0,0.1); 
    overflow: hidden; display: flex; flex-direction: column;
    border: 4px solid var(--primary);
}

header { 
    background: var(--primary); color: #fff; padding: 18px; 
    text-align: center; display: flex; justify-content: center; 
    align-items: center; gap: 12px; font-weight: 900; font-size: 1.3rem;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
}

/* MODIFICACIÓN: Iconos image_0 e image_1 circulares con fondo blanco */
header img, .mode-btn img, .flag-label { 
    width: 35px; 
    height: 35px;
    background: white !important;
    border-radius: 50% !important; 
    border: 2px solid #fff; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    object-fit: contain;
    padding: 2px;
}

.exam-bar { 
    background: #333; color: white; padding: 10px 20px; 
    display: none; justify-content: space-between; align-items: center; 
    font-size: 0.9rem; font-weight: bold;
}

.progress-container { width: 100%; height: 10px; background: #f5f5f5; }
.progress-bar { width: 0%; height: 100%; background: var(--secondary); transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

/* BOTONES DE MODO */
.mode-selector { display: flex; padding: 12px; gap: 10px; background: #fff; }
.mode-btn { 
    flex: 1; padding: 12px; border: 3px solid #eee; border-radius: 20px; 
    background: #fff; color: #757575; font-weight: 800; cursor: pointer; 
    display: flex; align-items: center; justify-content: center; gap: 6px; 
    transition: all 0.2s; font-size: 0.8rem;
}
.mode-btn img { width: 25px; height: 25px; }

.mode-btn.active.img-en { background: var(--color-img-mode); color: white; border-color: #e65100; transform: scale(1.05); }
.mode-btn.active.en-img { background: var(--color-word-mode); color: white; border-color: #283593; transform: scale(1.05); }
.mode-btn.exam.active { background: var(--color-exam-mode); color: #333; border-color: #76c776; transform: scale(1.05); }

.controls-top { padding: 10px 20px; text-align: center; }
select { 
    padding: 12px; border-radius: 25px; border: 3px solid var(--primary); 
    font-weight: 800; width: 100%; cursor: pointer; color: #555; background: #fff3e0;
    font-size: 1rem;
}

.mix-panel { 
    display: none; background: #fff3e0; padding: 20px; margin: 0 15px 15px 15px; 
    border-radius: 25px; text-align: left; max-height: 200px; overflow-y: auto; 
    border: 3px dashed var(--primary);
}

/* CARTA DE JUEGO */
.scene { width: 100%; height: 360px; perspective: 1000px; display: flex; justify-content: center; align-items: center; }
.card { width: 300px; height: 300px; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
.card.is-flipped { transform: rotateY(180deg); }
.card-face { 
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
    border-radius: 40px; display: flex; flex-direction: column; align-items: center; 
    justify-content: center; padding: 25px; box-sizing: border-box; border: 10px solid #fff; 
    box-shadow: 0 15px 30px rgba(0,0,0,0.08); 
}
.face-img { background: #e0f7fa; }
.face-word { background: var(--card-bg-word); color: white; }
.card-face.back { transform: rotateY(180deg); }

.main-img { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; font-size: 9rem; }
.main-img img { max-width: 95%; max-height: 95%; object-fit: contain; }
.main-text { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; text-align: center; }
.flag-label { margin-bottom: 15px; border: 4px solid white !important; }

.exam-actions { display: none; gap: 30px; margin-top: 20px; }
.action-btn { border: none; border-radius: 50%; width: 70px; height: 70px; color: white; font-size: 2.2rem; cursor: pointer; box-shadow: 0 8px 15px rgba(0,0,0,0.2); transition: transform 0.1s; }
.btn-yes { background: var(--color-success); }
.btn-no { background: var(--color-error); }

.nav-controls { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #fff; }
.nav-btn { 
    background: var(--primary); color: #fff; border: none; width: 55px; height: 55px; 
    border-radius: 50%; font-size: 1.6rem; cursor: pointer; box-shadow: 0 6px 0px #e65100;
}
.nav-btn:active { transform: translateY(3px); box-shadow: 0 3px 0px #e65100; }
.nav-btn:disabled { background: #eee; box-shadow: none; opacity: 0.5; }
.counter { font-weight: 900; color: #555; font-size: 1.1rem; }

.sound-btn { background: rgba(255,255,255,0.3); border: 3px solid #fff; color: #fff; border-radius: 50%; width: 55px; height: 55px; cursor: pointer; font-size: 1.6rem; margin-top: 15px; }
</style>
</head>
<body>

<div class="app">
    <div class="exam-bar" id="examBar">
        <span>⏱️ <span id="timer">00:00</span></span>
        <span>🔥 <span id="streak">0</span></span>
        <span>✅ <span id="scoreCorrect">0</span> | ❌ <span id="scoreWrong">0</span></span>
    </div>
    <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>

    <header>
        <img src="image_0.png"> Picture Dictionary 3 <img src="image_0.png">
    </header>

    <div class="mode-selector">
        <button id="btnImgEn" class="mode-btn active img-en" onclick="setMode('IMG-EN')"><img src="image_1.png"> ➔ <img src="image_0.png"></button>
        <button id="btnEnImg" class="mode-btn en-img" onclick="setMode('EN-IMG')"><img src="image_0.png"> ➔ <img src="image_1.png"></button>
        <button id="btnExam" class="mode-btn exam" onclick="toggleExamMode()">🎓 EXAM</button>
    </div>

    <div class="controls-top">
        <select id="categorySelect" onchange="handleCategoryChange()">
            <option value="ALL">🌟 All Topics</option>
            <option value="MIXED">🧩 Mixed Topics</option>
        </select>
    </div>

    <div id="mixPanel" class="mix-panel">
        <strong>Choose your topics:</strong><hr>
        <div id="mixCheckboxes"></div>
        <button style="width:100%; margin-top:15px; background:var(--primary); color:#fff; border:none; padding:10px; border-radius:15px; font-weight:bold; cursor:pointer;" onclick="changeCategory()">Start!</button>
    </div>

    <div class="scene">
        <div class="card" id="flashcard" onclick="flipCard()">
            <div class="card-face front" id="faceFront">
                <div class="main-img" id="imgFront"></div>
                <img id="flagFront" class="flag-label" src="image_0.png" style="display:none">
                <div class="main-text" id="textFront"></div>
            </div>
            <div class="card-face back" id="faceBack">
                <div class="main-img" id="imgBack"></div>
                <img id="flagBack" class="flag-label" src="image_0.png" style="display:none">
                <div class="main-text" id="textBack"></div>
                <div id="examActions" class="exam-actions">
                    <button class="action-btn btn-no" onclick="event.stopPropagation(); markResult(false)">❌</button>
                    <button class="action-btn btn-yes" onclick="event.stopPropagation(); markResult(true)">✅</button>
                </div>
                <button id="soundBtn" class="sound-btn" onclick="event.stopPropagation(); playCurrentAudio()">🔊</button>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" onclick="prevCard()">⬅️</button>
        <div class="counter" id="counterDisplay">0 / 0</div>
        <button class="nav-btn" id="nextBtn" onclick="nextCard()">➡️</button>
    </div>
</div>

<script>
/* El script se mantiene íntegro según el original */
const vocab = [
    {en:"MONDAY", img:"Monday.png", cat:"DAYS", isImage: true}, {en:"TUESDAY", img:"Tuesday.png", cat:"DAYS", isImage: true},
    {en:"WEDNESDAY", img:"Wednesday.png", cat:"DAYS", isImage: true}, {en:"THURSDAY", img:"Thursday.png", cat:"DAYS", isImage: true},
    {en:"FRIDAY", img:"Friday.png", cat:"DAYS", isImage: true}, {en:"SATURDAY", img:"Saturday.png", cat:"DAYS", isImage: true},
    {en:"SUNDAY", img:"Sunday.png", cat:"DAYS", isImage: true},
    {en:"GET UP", img:"get up.png", cat:"ROUTINES", isImage: true}, {en:"GO HOME", img:"go home.png", cat:"ROUTINES", isImage: true},
    {en:"GO TO BED", img:"go to bed.png", cat:"ROUTINES", isImage: true}, {en:"GO TO SCHOOL", img:"go to school.png", cat:"ROUTINES", isImage: true},
    {en:"HAVE A SHOWER", img:"have a shower.png", cat:"ROUTINES", isImage: true}, {en:"HAVE BREAKFAST", img:"have breakfast.png", cat:"ROUTINES", isImage: true},
    {en:"HAVE DINNER", img:"have dinner.png", cat:"ROUTINES", isImage: true}, {en:"HAVE LUNCH", img:"have lunch.png", cat:"ROUTINES", isImage: true},
    {en:"BIKE", img:"🚲", cat:"TRANSPORT"}, {en:"CAR", img:"🚗", cat:"TRANSPORT"}, {en:"BUS", img:"🚌", cat:"TRANSPORT"},
    {en:"TRAIN", img:"🚆", cat:"TRANSPORT"}, {en:"TAXI", img:"🚕", cat:"TRANSPORT"}, {en:"PLANE", img:"✈️", cat:"TRANSPORT"}, {en:"HELICOPTER", img:"🚁", cat:"TRANSPORT"},
    {en:"ART", img:"🎨", cat:"SUBJECTS"}, {en:"ENGLISH", img:"english2.png", cat:"SUBJECTS", isImage: true}, {en:"IT", img:"💻", cat:"SUBJECTS"},
    {en:"MATHS", img:"🔢", cat:"SUBJECTS"}, {en:"MUSIC", img:"🎵", cat:"SUBJECTS"}, {en:"PE", img:"⚽", cat:"SUBJECTS"},
    {en:"SCIENCE", img:"🧪", cat:"SUBJECTS"}, {en:"SPANISH", img:"spanish.png", cat:"SUBJECTS", isImage: true},
    {en:"CITY", img:"city.png", cat:"TOWN", isImage: true}, {en:"VILLAGE", img:"village.png", cat:"TOWN", isImage: true},
    {en:"TOWN", img:"town.png", cat:"TOWN", isImage: true}, {en:"POST OFFICE", img:"post office.png", cat:"TOWN", isImage: true},
    {en:"PARK", img:"park.png", cat:"TOWN", isImage: true}, {en:"HOUSE", img:"🏠", cat:"TOWN"},
    {en:"CINEMA", img:"🎬", cat:"TOWN"}, {en:"FIRE STATION", img:"🚒", cat:"TOWN"}, {en:"MUSEUM", img:"🏛️", cat:"TOWN"},
    {en:"HOSPITAL", img:"🏥", cat:"TOWN"}, {en:"SHOPPING CENTRE", img:"🛍️", cat:"TOWN"}, {en:"SWIMMING POOL", img:"🏊", cat:"TOWN"},
    {en:"TRAIN STATION", img:"🚉", cat:"TOWN"}, {en:"ZOO", img:"🦒", cat:"TOWN"}, {en:"SCHOOL", img:"🏫", cat:"TOWN"},
    {en:"SUPERMARKET", img:"🛒", cat:"TOWN"}, {en:"HOTEL", img:"🏨", cat:"TOWN"}, {en:"BEACH", img:"🏖️", cat:"TOWN"}, {en:"LIBRARY", img:"📚", cat:"TOWN"},
    {en:"OSTRICH", img:"ostrich.png", cat:"ANIMALS", isImage: true}, {en:"CROCODILE", img:"🐊", cat:"ANIMALS"},
    {en:"ELEPHANT", img:"🐘", cat:"ANIMALS"}, {en:"FLAMINGO", img:"🦩", cat:"ANIMALS"}, {en:"KANGAROO", img:"🦘", cat:"ANIMALS"},
    {en:"LION", img:"🦁", cat:"ANIMALS"}, {en:"MONKEY", img:"🐒", cat:"ANIMALS"}, {en:"TIGER", img:"🐅", cat:"ANIMALS"},
    {en:"BEAK", img:"beak.png", cat:"ANIMALS_BODY", isImage: true}, {en:"CLAWS", img:"claws.png", cat:"ANIMALS_BODY", isImage: true},
    {en:"FUR", img:"fur.png", cat:"ANIMALS_BODY", isImage: true}, {en:"TAIL", img:"tail.png", cat:"ANIMALS_BODY", isImage: true},
    {en:"TEETH", img:"teeth.png", cat:"ANIMALS_BODY", isImage: true}, {en:"WINGS", img:"wing.png", cat:"ANIMALS_BODY", isImage: true},
    {en:"LEGS", img:"legs.png", cat:"ANIMALS_BODY", isImage: true}, {en:"EARS", img:"ears.png", cat:"ANIMALS_BODY", isImage: true},
    {en:"EAT", img:"eat.png", cat:"ACTIONS", isImage: true}, {en:"DRINK", img:"drink.png", cat:"ACTIONS", isImage: true},
    {en:"JUMP", img:"jump.png", cat:"ACTIONS", isImage: true}, {en:"FLY", img:"fly.png", cat:"ACTIONS", isImage: true},
    {en:"CLIMB", img:"🧗", cat:"ACTIONS"}, {en:"SWIM", img:"🏊", cat:"ACTIONS"}, {en:"RUN", img:"🏃", cat:"ACTIONS"}, {en:"WALK", img:"🚶", cat:"ACTIONS"},
    {en:"PLAYING THE RECORDER", img:"playing the recorder.png", cat:"HOBBIES", isImage: true},
    {en:"READING COMICS", img:"reading comics.png", cat:"HOBBIES", isImage: true},
    {en:"USING THE INTERNET", img:"using internet.png", cat:"HOBBIES", isImage: true},
    {en:"MAKING MODELS", img:"making models.png", cat:"HOBBIES", isImage: true},
    {en:"DOING EXERCISE", img:"🏋️", cat:"HOBBIES"}, {en:"GOING TO THE PARK", img:"🌳", cat:"HOBBIES"},
    {en:"LISTENING TO MUSIC", img:"🎧", cat:"HOBBIES"}, {en:"ROLLERBLADING", img:"🛼", cat:"HOBBIES"},
    {en:"WATCHING TV", img:"📺", cat:"HOBBIES"}, {en:"DANCING", img:"💃", cat:"HOBBIES"},
    {en:"DOING KARATE", img:"🥋", cat:"HOBBIES"}, {en:"JUGGLING", img:"🤹", cat:"HOBBIES"},
    {en:"PAINTING", img:"🎨", cat:"HOBBIES"}, {en:"PLAYING THE GUITAR", img:"🎸", cat:"HOBBIES"},
    {en:"RIDING A BIKE", img:"🚲", cat:"HOBBIES"}, {en:"SINGING", img:"🎤", cat:"HOBBIES"},
    {en:"YOGURT", img:"yogurt.png", cat:"FOOD", isImage: true}, {en:"BREAD", img:"🍞", cat:"FOOD"},
    {en:"CEREAL", img:"cereal.png", cat:"FOOD", isImage: true}, {en:"EGGS", img:"eggs.png", cat:"FOOD", isImage: true},
    {en:"HAM", img:"ham.png", cat:"FOOD", isImage: true}, {en:"RICE", img:"🍚", cat:"FOOD"},
    {en:"SAUSAGES", img:"sausages.png", cat:"FOOD", isImage: true}, {en:"SPAGHETTI", img:"🍝", cat:"FOOD"},
    {en:"VEGETABLES", img:"vegetables.png", cat:"FOOD", isImage: true}, {en:"BROCCOLI", img:"🥦", cat:"FOOD"},
    {en:"CAKE", img:"🍰", cat:"FOOD"}, {en:"CHEESE", img:"🧀", cat:"FOOD"},
    {en:"CHICKEN", img:"chicken.png", cat:"FOOD", isImage: true}, {en:"FISH", img:"🐟", cat:"FOOD"},
    {en:"FRUIT", img:"🍎", cat:"FOOD"}, {en:"MEAT", img:"🥩", cat:"FOOD"}, {en:"SALAD", img:"🥗", cat:"FOOD"},
    {en:"SOUP", img:"soup.png", cat:"FOOD", isImage: true}, {en:"APPLE", img:"🍎", cat:"FOOD"},
    {en:"BANANA", img:"🍌", cat:"FOOD"}, {en:"ORANGE", img:"🍊", cat:"FOOD"}, {en:"PEAR", img:"🍐", cat:"FOOD"},
    {en:"STRAWBERRY", img:"🍓", cat:"FOOD"}, {en:"JUICE", img:"🧃", cat:"FOOD"}, {en:"MILK", img:"🥛", cat:"FOOD"},
    {en:"WATER", img:"💧", cat:"FOOD"}, {en:"CARROTS", img:"🥕", cat:"FOOD"},
    {en:"CAULIFLOWER", img:"cauliflower.png", cat:"FOOD", isImage: true}, {en:"PEAS", img:"🫛", cat:"FOOD"}
];

let currentList = [], currentIndex = 0, isFlipped = false, errorList = [];
let gameMode = 'IMG-EN', isExamMode = false;
let seconds = 0, timerInterval = null, correct = 0, wrong = 0, currentStreak = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playFeedbackSound(isCorrect) {
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    if (isCorrect) {
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); 
        oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.3);
    } else {
        oscillator.type = 'sawtooth';
        oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.3);
    }
}

const ui = {
    card: document.getElementById("flashcard"),
    faceFront: document.getElementById("faceFront"), faceBack: document.getElementById("faceBack"),
    textFront: document.getElementById("textFront"), textBack: document.getElementById("textBack"),
    imgFront: document.getElementById("imgFront"), imgBack: document.getElementById("imgBack"),
    flagFront: document.getElementById("flagFront"), flagBack: document.getElementById("flagBack"),
    counter: document.getElementById("counterDisplay"),
    prevBtn: document.getElementById("prevBtn"), nextBtn: document.getElementById("nextBtn"),
    catSelect: document.getElementById("categorySelect"),
    examBar: document.getElementById("examBar"),
    timer: document.getElementById("timer"), streak: document.getElementById("streak"),
    scoreCorrect: document.getElementById("scoreCorrect"), scoreWrong: document.getElementById("scoreWrong"),
    examActions: document.getElementById("examActions"), soundBtn: document.getElementById("soundBtn"),
    mixPanel: document.getElementById("mixPanel"), mixCheckboxes: document.getElementById("mixCheckboxes"),
    progressBar: document.getElementById("progressBar")
};

const categoryOrder = [
    { name: "DAYS", emoji: "🗓️" }, { name: "ROUTINES", emoji: "⏰" }, { name: "TRANSPORT", emoji: "🚗" }, 
    { name: "SUBJECTS", emoji: "📚" }, { name: "TOWN", emoji: "🏙️" }, { name: "ANIMALS", emoji: "🦁" }, 
    { name: "ANIMALS_BODY", emoji: "🦴" }, { name: "ACTIONS", emoji: "🏃" }, { name: "FOOD", emoji: "🍎" }, { name: "HOBBIES", emoji: "🎨" }
];

function initCategories() {
    categoryOrder.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat.name; opt.textContent = `${cat.emoji} ${cat.name}`;
        ui.catSelect.appendChild(opt);
        ui.mixCheckboxes.innerHTML += `<div><input type="checkbox" value="${cat.name}" id="cb_${cat.name}"> <label for="cb_${cat.name}">${cat.emoji} ${cat.name}</label></div>`;
    });
}

function setMode(mode) {
    gameMode = mode;
    document.getElementById("btnImgEn").classList.toggle("active", mode === 'IMG-EN');
    document.getElementById("btnEnImg").classList.toggle("active", mode === 'EN-IMG');
    resetCardFace(); updateUI();
}

function toggleExamMode() {
    isExamMode = !isExamMode;
    document.getElementById("btnExam").classList.toggle("active", isExamMode);
    ui.examBar.style.display = isExamMode ? "flex" : "none";
    ui.examActions.style.display = isExamMode ? "flex" : "none";
    ui.soundBtn.style.display = isExamMode ? "none" : "block";
    if(isExamMode) startExam(); else resetExam();
}

function startExam() {
    resetExam();
    timerInterval = setInterval(() => {
        seconds++;
        ui.timer.textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
    }, 1000);
    changeCategory();
}

function resetExam() {
    clearInterval(timerInterval); seconds = 0; correct = 0; wrong = 0; currentStreak = 0; errorList = [];
    ui.timer.textContent = "00:00"; ui.scoreCorrect.textContent = "0"; ui.scoreWrong.textContent = "0"; ui.streak.textContent = "0";
}

function markResult(isCorrect) {
    playFeedbackSound(isCorrect);
    if(isCorrect) { correct++; currentStreak++; } 
    else { wrong++; currentStreak = 0; errorList.push(currentList[currentIndex]); }
    ui.scoreCorrect.textContent = correct; ui.scoreWrong.textContent = wrong; ui.streak.textContent = currentStreak;
    if(currentIndex === currentList.length - 1) {
        clearInterval(timerInterval);
        if(errorList.length > 0 && confirm("Game Over! Repeat the errors?")) {
            currentList = [...errorList]; errorList = []; currentIndex = 0; resetCardFace(); updateUI();
        } else toggleExamMode();
    } else nextCard();
}

function handleCategoryChange() {
    ui.mixPanel.style.display = (ui.catSelect.value === "MIXED") ? "block" : "none";
    if(ui.catSelect.value !== "MIXED") changeCategory();
}

function changeCategory() {
    const val = ui.catSelect.value;
    let selectedCats = [];
    if(val === "ALL") selectedCats = categoryOrder.map(c => c.name);
    else if (val === "MIXED") {
        selectedCats = Array.from(ui.mixCheckboxes.querySelectorAll('input:checked')).map(cb => cb.value);
        if(selectedCats.length === 0) return;
        ui.mixPanel.style.display = "none";
    } else selectedCats = [val];

    currentList = vocab.filter(item => selectedCats.includes(item.cat)).sort(() => Math.random() - 0.5);
    currentIndex = 0; resetCardFace(); updateUI();
}

function updateUI() {
    if(currentList.length === 0) return;
    const item = currentList[currentIndex];
    const isImgEn = gameMode === 'IMG-EN';

    ui.imgFront.innerHTML = ""; ui.textFront.textContent = ""; ui.flagFront.style.display = "none";
    ui.imgBack.innerHTML = ""; ui.textBack.textContent = ""; ui.flagBack.style.display = "none";

    if (isImgEn) {
        ui.faceFront.className = 'card-face front face-img';
        item.isImage ? ui.imgFront.innerHTML = `<img src="${item.img}">` : ui.imgFront.innerHTML = item.img;
        ui.faceBack.className = 'card-face back face-word';
        ui.textBack.textContent = item.en;
        ui.flagBack.src = "image_0.png";
        ui.flagBack.style.display = "block";
    } else {
        ui.faceFront.className = 'card-face front face-word';
        ui.textFront.textContent = item.en;
        ui.flagFront.src = "image_0.png";
        ui.flagFront.style.display = "block";
        ui.faceBack.className = 'card-face back face-img';
        item.isImage ? ui.imgBack.innerHTML = `<img src="${item.img}">` : ui.imgBack.innerHTML = item.img;
    }

    ui.counter.textContent = `${currentIndex + 1} / ${currentList.length}`;
    ui.progressBar.style.width = `${((currentIndex + 1) / currentList.length) * 100}%`;
    ui.prevBtn.disabled = (currentIndex === 0);
    ui.nextBtn.disabled = (currentIndex === currentList.length - 1);
}

function flipCard() { 
    isFlipped = !isFlipped; 
    ui.card.classList.toggle("is-flipped", isFlipped); 
    if(isFlipped) setTimeout(playCurrentAudio, 200); 
}

function resetCardFace() { isFlipped = false; ui.card.classList.remove("is-flipped"); }
function nextCard() { if(currentIndex < currentList.length - 1) { currentIndex++; resetCardFace(); setTimeout(updateUI, 150); } }
function prevCard() { if(currentIndex > 0) { currentIndex--; resetCardFace(); setTimeout(updateUI, 150); } }

function playCurrentAudio() {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(currentList[currentIndex].en);
    utterance.lang = "en-GB"; utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}

initCategories();
changeCategory();
setMode('IMG-EN');
</script>
</body>

</html>
